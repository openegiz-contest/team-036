# OpenPit Twin overlay for the official OpenEgiz Docker Compose platform.
services:
  openpit-setup:
    build: ../../team/openpit
    image: openegiz/openpit-twin:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully
  openpit-simulator:
    image: openegiz/openpit-twin:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SIM_SPEEDUP: ${SIM_SPEEDUP:-20}
      OPENPIT_SCENARIO: ${OPENPIT_SCENARIO:-normal}
    depends_on:
      openpit-setup:
        condition: service_completed_successfully
  grafana:
    volumes:
      - ../../team/openpit/dashboard.json:/var/lib/grafana/example-dashboards/openpit-twin.json:ro

  openpit-scene:
    image: openegiz/openpit-twin:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 96m
    command: ["python", "scene.py"]
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      openpit-setup:
        condition: service_completed_successfully
